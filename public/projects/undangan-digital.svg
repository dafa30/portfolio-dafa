<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-undangan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151f" />
      <stop offset="100%" stop-color="#2a2233" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="50%" stop-color="#e5b887" />
      <stop offset="100%" stop-color="#c99763" />
    </linearGradient>
    <filter id="shadow-undangan" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg-undangan)" />

  <!-- App Window Container -->
  <g filter="url(#shadow-undangan)" transform="translate(60, 45)">
    <rect width="1080" height="660" rx="16" fill="#1b1622" stroke="#3d3248" stroke-width="1.5" />

    <!-- Titlebar -->
    <rect width="1080" height="48" rx="16" fill="#261e30" />
    <rect y="36" width="1080" height="12" fill="#261e30" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="540" y="30" fill="#a89bb5" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Platform Website Undangan Pernikahan &amp; Acara Digital</text>

    <!-- Content Split: Left (Mobile Mockup Preview) & Right (Desktop / Features View) -->
    <g transform="translate(40, 75)">
      <!-- Left: Smartphone Frame -->
      <g transform="translate(30, 10)">
        <!-- Phone Outer -->
        <rect width="270" height="530" rx="36" fill="#0f0c13" stroke="#4a3b59" stroke-width="3" />
        <!-- Screen -->
        <rect x="8" y="8" width="254" height="514" rx="28" fill="#1e1826" />
        <!-- Notch / Dynamic Island -->
        <rect x="95" y="16" width="80" height="18" rx="9" fill="#0f0c13" />

        <!-- Invitation Screen Content -->
        <!-- Floral / Arch Accent -->
        <path d="M40 70 Q135 45 230 70" stroke="url(#gold-accent)" stroke-width="1.5" fill="none" opacity="0.6" />
        <text x="135" y="115" fill="#e5b887" font-family="'Georgia', serif" font-size="11" letter-spacing="3" text-anchor="middle">THE WEDDING OF</text>
        <text x="135" y="150" fill="#ffffff" font-family="'Georgia', serif" font-size="24" font-weight="700" text-anchor="middle">Rian &amp; Sarah</text>
        <text x="135" y="172" fill="#a89bb5" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" text-anchor="middle">Minggu, 18 Agustus 2026</text>

        <!-- Countdown Timer -->
        <g transform="translate(22, 195)">
          <rect width="48" height="42" rx="8" fill="#2d2238" />
          <text x="24" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">12</text>
          <text x="24" y="36" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">HARI</text>

          <rect x="54" width="48" height="42" rx="8" fill="#2d2238" />
          <text x="78" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">08</text>
          <text x="78" y="36" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">JAM</text>

          <rect x="108" width="48" height="42" rx="8" fill="#2d2238" />
          <text x="132" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">45</text>
          <text x="132" y="36" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">MENIT</text>

          <rect x="162" width="48" height="42" rx="8" fill="#2d2238" />
          <text x="186" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">20</text>
          <text x="186" y="36" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">DETIK</text>
        </g>

        <!-- Guest Tag Card -->
        <g transform="translate(22, 255)">
          <rect width="210" height="52" rx="8" fill="#2d2238" stroke="#4a3b59" stroke-width="0.8" />
          <text x="105" y="22" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Kepada Yth. Bapak/Ibu/Saudara</text>
          <text x="105" y="40" fill="#f5d0a9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tamu Undangan Terhormat</text>
        </g>

        <!-- RSVP Mini Button -->
        <g transform="translate(35, 325)">
          <rect width="184" height="34" rx="17" fill="url(#gold-accent)" />
          <text x="92" y="22" fill="#1e1826" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Konfirmasi Kehadiran (RSVP)</text>
        </g>

        <!-- Event Location -->
        <g transform="translate(22, 380)">
          <rect width="210" height="90" rx="10" fill="#261d30" />
          <circle cx="35" cy="30" r="14" fill="#3d2c4e" />
          <path d="M35 22c-3.5 0-6 2.5-6 6 0 4.5 6 9 6 9s6-4.5 6-9c0-3.5-2.5-6-6-6zm0 8a2 2 0 110-4 2 2 0 010 4z" fill="#e5b887" />
          <text x="58" y="26" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Akad &amp; Resepsi</text>
          <text x="58" y="40" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="9">Grand Ballroom Hotel</text>
          <text x="58" y="54" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="9">Jakarta Selatan</text>
          <rect x="25" y="64" width="160" height="18" rx="4" fill="#3d2c4e" />
          <text x="105" y="77" fill="#e5b887" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Buka Google Maps</text>
        </g>

        <!-- Audio Disc Float -->
        <circle cx="230" cy="495" r="14" fill="#e5b887" />
        <path d="M226 490v10l8-5z" fill="#1b1622" />
      </g>

      <!-- Right Side: Platform Features & Management Preview -->
      <g transform="translate(380, 20)">
        <text x="10" y="26" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700">Fitur &amp; Arsitektur Website Undangan Digital</text>
        <text x="10" y="50" fill="#9e8fae" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">Pengalaman interaktif multi-perangkat dengan animasi halus dan manajemen buku tamu</text>

        <!-- Feature Card 1: RSVP & Ucapan -->
        <g transform="translate(10, 75)">
          <rect width="600" height="120" rx="12" fill="#251c2e" stroke="#3d2c4a" stroke-width="1" />
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#e5b887" fill-opacity="0.15" />
          <path d="M32 40l6 6 12-12" stroke="#e5b887" stroke-width="2.5" stroke-linecap="round" fill="none" />
          <text x="75" y="36" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Formulir Konfirmasi Kehadiran (RSVP) &amp; Buku Doa</text>
          <text x="75" y="58" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="12">Tamu dapat mengonfirmasi jumlah kehadiran serta mengirimkan ucapan selamat secara real-time.</text>
          <rect x="75" y="76" width="115" height="24" rx="6" fill="#3a2b47" />
          <text x="132" y="92" fill="#e5b887" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">148 Doa Diterima</text>
        </g>

        <!-- Feature Card 2: Custom Nama Tamu -->
        <g transform="translate(10, 215)">
          <rect width="600" height="120" rx="12" fill="#251c2e" stroke="#3d2c4a" stroke-width="1" />
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15" />
          <circle cx="40" cy="35" r="7" stroke="#60a5fa" stroke-width="2" fill="none" />
          <path d="M30 48c0-5 4-7 10-7s10 2 10 7" stroke="#60a5fa" stroke-width="2" fill="none" />
          <text x="75" y="36" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Personalisasi Tautan &amp; Nama Penerima Undangan</text>
          <text x="75" y="58" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="12">Generasi parameter URL dinamis (?to=Nama+Tamu) agar setiap tamu merasa dihargai secara eksklusif.</text>
          <rect x="75" y="76" width="165" height="24" rx="6" fill="#3a2b47" />
          <text x="157" y="92" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Direct Sharing via WhatsApp</text>
        </g>

        <!-- Feature Card 3: Galeri & Audio Player -->
        <g transform="translate(10, 355)">
          <rect width="600" height="120" rx="12" fill="#251c2e" stroke="#3d2c4a" stroke-width="1" />
          <rect x="20" y="20" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.15" />
          <circle cx="40" cy="40" r="10" stroke="#34d399" stroke-width="2" fill="none" />
          <path d="M37 36v8l7-4z" fill="#34d399" />
          <text x="75" y="36" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">Galeri Foto, Kisah Cinta, &amp; Latar Belakang Musik</text>
          <text x="75" y="58" fill="#9e8fae" font-family="'Segoe UI', sans-serif" font-size="12">Pengalaman audio autoplay yang dapat dikontrol oleh pengguna dengan tombol mute/unmute mengambang.</text>
          <rect x="75" y="76" width="135" height="24" rx="6" fill="#3a2b47" />
          <text x="142" y="92" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Responsive Across Devices</text>
        </g>
      </g>
    </g>
  </g>
</svg>
