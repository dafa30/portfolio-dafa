<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-surat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#19223c" />
    </linearGradient>
    <linearGradient id="badge-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow-persuratan" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg-surat)" />

  <!-- App Window Container -->
  <g filter="url(#shadow-persuratan)" transform="translate(60, 45)">
    <!-- Window Border & Body -->
    <rect width="1080" height="660" rx="16" fill="#0c1427" stroke="#334155" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect width="1080" height="48" rx="16" fill="#17223b" />
    <rect y="36" width="1080" height="12" fill="#17223b" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="540" y="30" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Siteman-Surat — Aplikasi Web Manajemen Persuratan MPR RI</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="612" fill="#101930" />
      <line x1="220" y1="0" x2="220" y2="612" stroke="#334155" stroke-width="1" />

      <!-- MPR RI Emblem Badge -->
      <g transform="translate(20, 24)">
        <rect width="36" height="36" rx="8" fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M28 32l10-14 10 14-4 2-6-8-6 8z" fill="#f59e0b" transform="translate(-10, -5)" />
        <text x="48" y="16" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700">SITEMAN-SURAT</text>
        <text x="48" y="30" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Setjen MPR RI</text>
      </g>

      <!-- Nav Items -->
      <g transform="translate(16, 85)">
        <text x="32" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500">Beranda Sistem</text>
      </g>
      <g transform="translate(16, 130)">
        <rect width="188" height="38" rx="8" fill="#3b82f6" fill-opacity="0.15" />
        <rect width="4" height="24" rx="2" x="0" y="7" fill="#3b82f6" />
        <text x="32" y="24" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Surat Masuk (38)</text>
      </g>
      <g transform="translate(16, 175)">
        <text x="32" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500">Surat Keluar (21)</text>
      </g>
      <g transform="translate(16, 220)">
        <text x="32" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500">Alur Disposisi</text>
      </g>
      <g transform="translate(16, 265)">
        <text x="32" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500">Tracking Surat</text>
      </g>
      <g transform="translate(16, 310)">
        <text x="32" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500">Arsip Digital & Klasifikasi</text>
      </g>

      <!-- Badge XP -->
      <g transform="translate(16, 530)">
        <rect width="188" height="60" rx="8" fill="#17223b" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">METODOLOGI XP</text>
        <text x="14" y="42" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Extreme Programming Development</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(240, 68)">
      <text x="10" y="26" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700">Digitalisasi Administrasi & Tracking Persuratan</text>
      <text x="10" y="48" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Subbagian Hubungan Antarlembaga — Biro Hubungan Masyarakat dan Sistem Informasi</text>

      <!-- Action Button -->
      <g transform="translate(650, 10)">
        <rect width="160" height="38" rx="8" fill="#2563eb" />
        <text x="80" y="24" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Registrasi Surat Masuk</text>
      </g>

      <!-- Stepper / Disposisi Flow Banner -->
      <g transform="translate(10, 70)">
        <rect width="800" height="84" rx="12" fill="#16223d" stroke="#2a3b5c" stroke-width="1" />
        <text x="20" y="28" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700">ALUR PELACAKAN DISPOSISI SURAT ELEKTRONIK</text>

        <!-- Stepper Node 1 -->
        <g transform="translate(30, 42)">
          <circle cx="12" cy="14" r="10" fill="#10b981" />
          <path d="M9 14l2 2 4-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <text x="32" y="18" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">1. Registrasi Agenda</text>
        </g>
        <line x1="175" y1="56" x2="225" y2="56" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />

        <!-- Stepper Node 2 -->
        <g transform="translate(240, 42)">
          <circle cx="12" cy="14" r="10" fill="#10b981" />
          <path d="M9 14l2 2 4-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <text x="32" y="18" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">2. Disposisi Pimpinan</text>
        </g>
        <line x1="395" y1="56" x2="445" y2="56" stroke="#3b82f6" stroke-width="2" />

        <!-- Stepper Node 3 -->
        <g transform="translate(460, 42)">
          <circle cx="12" cy="14" r="10" fill="#3b82f6" />
          <circle cx="12" cy="14" r="4" fill="#ffffff" />
          <text x="32" y="18" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">3. Tindak Lanjut Unit</text>
        </g>
        <line x1="610" y1="56" x2="660" y2="56" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />

        <!-- Stepper Node 4 -->
        <g transform="translate(675, 42)">
          <circle cx="12" cy="14" r="10" fill="#334155" />
          <text x="12" y="18" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">4</text>
          <text x="32" y="18" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Arsip Digital</text>
        </g>
      </g>

      <!-- Table Section -->
      <g transform="translate(10, 175)">
        <rect width="800" height="380" rx="12" fill="#17223b" stroke="#334155" stroke-width="1" />

        <!-- Table Header -->
        <rect width="800" height="42" rx="12" fill="#1e2c4c" />
        <rect y="30" width="800" height="12" fill="#1e2c4c" />
        <text x="24" y="26" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">NO. AGENDA / SURAT</text>
        <text x="210" y="26" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">PERIHAL & ASAL SURAT</text>
        <text x="470" y="26" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">TANGGAL SURAT</text>
        <text x="630" y="26" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">STATUS DISPOSISI</text>

        <!-- Row 1 -->
        <g transform="translate(0, 52)">
          <line x1="20" y1="52" x2="780" y2="52" stroke="#2c3b5c" stroke-width="0.8" />
          <text x="24" y="24" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="600">AGD/MPR/2025/0821</text>
          <text x="24" y="42" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">No: 042/B-HAL/V/2025</text>
          <text x="210" y="24" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Permohonan Kunjungan Delegasi Hubungan Antarlembaga</text>
          <text x="210" y="42" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Asal: Kementerian Koordinator Bidang Polhukam</text>
          <text x="470" y="24" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">18 Mei 2025</text>
          <rect x="625" y="12" width="130" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2" />
          <text x="690" y="29" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Disposisi Kepala Biro</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 118)">
          <line x1="20" y1="52" x2="780" y2="52" stroke="#2c3b5c" stroke-width="0.8" />
          <text x="24" y="24" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="600">AGD/MPR/2025/0819</text>
          <text x="24" y="42" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">No: 118/UM/SEK/IV/2025</text>
          <text x="210" y="24" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Undangan Rapat Koordinasi Publikasi Media Nasional</text>
          <text x="210" y="42" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Asal: Dewan Pers Republik Indonesia</text>
          <text x="470" y="24" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">15 Mei 2025</text>
          <rect x="625" y="12" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
          <text x="690" y="29" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Selesai Ditindaklanjuti</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 184)">
          <line x1="20" y1="52" x2="780" y2="52" stroke="#2c3b5c" stroke-width="0.8" />
          <text x="24" y="24" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="600">AGD/MPR/2025/0814</text>
          <text x="24" y="42" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">No: 89/D-ADM/IV/2025</text>
          <text x="210" y="24" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Penyampaian Salinan Risalah Sidang Tahunan</text>
          <text x="210" y="42" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Asal: Bagian Risalah dan Dokumen MPR</text>
          <text x="470" y="24" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">11 Mei 2025</text>
          <rect x="625" y="12" width="130" height="26" rx="6" fill="#d97706" fill-opacity="0.2" />
          <text x="690" y="29" fill="#fbbf24" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Menunggu Verifikasi</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 250)">
          <text x="24" y="24" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="600">AGD/MPR/2025/0808</text>
          <text x="24" y="42" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">No: 201/SET/V/2025</text>
          <text x="210" y="24" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Usulan Studi Banding Transformasi Tata Naskah Dinas</text>
          <text x="210" y="42" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Asal: Badan Keahlian DPR RI</text>
          <text x="470" y="24" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">08 Mei 2025</text>
          <rect x="625" y="12" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
          <text x="690" y="29" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Arsip Digital Tersimpan</text>
        </g>
      </g>
    </g>
  </g>
</svg>
